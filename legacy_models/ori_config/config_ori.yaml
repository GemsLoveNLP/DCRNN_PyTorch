---
data:
  # Data specific parameters
  graph_pkl_filename: "data/graph_folder/adj_mx.pkl"  # Path to the adjacency matrix
  dataset_dir: "data/data_folder"  # Path to time series data
  batch_size: 64  # Batch size for training and evaluation
  val_batch_size: 64
  test_batch_size: 64
  scaler_file: "data/scaler.pkl"  # File for scaler object used for standardization

model:
  cl_decay_steps: 2000
  filter_type: dual_random_walk
  horizon: 24
  input_dim: 2
  l1_decay: 0
  max_diffusion_step: 2
  num_nodes: 92
  num_rnn_layers: 2
  output_dim: 1
  rnn_units: 64
  seq_len: 4
  use_curriculum_learning: true

train:
  base_lr: 0.01
  dropout: 0
  epoch: 0
  epochs: 100
  epsilon: 1.0e-3
  global_step: 0
  lr_decay_ratio: 0.1
  max_grad_norm: 5
  max_to_keep: 100
  min_learning_rate: 2.0e-06
  optimizer: adam
  patience: 50
  steps: [20, 30, 40, 50]
  test_every_n_epochs: 10

logging:
  # Logging related parameters
  log_dir: "logs/"  # Directory to store log files
  checkpoint_dir: "checkpoints/"  # Directory to store model checkpoints
  log_level: "INFO"  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)

base_dir: "experiments"  # Base directory for experiment outputs and logs